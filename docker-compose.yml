services:
  neo4j:
    image: neo4j:5.26-community
    container_name: safemeds-agent-neo4j
    environment:
      NEO4J_AUTH: neo4j/safemeds-password
      NEO4J_dbms_security_auth__minimum__password__length: 8
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p safemeds-password 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12

  neo4j-import:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements-docker.txt
    container_name: safemeds-agent-neo4j-import
    env_file:
      - ./.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: safemeds-password
      NEO4J_DATABASE: neo4j
      EMBEDDING_BACKEND: local_hash
      LLM_ENABLE_EXTRACTION: "true"
    command: ["python", "scripts/import_neo4j_kg.py", "--reset"]
    depends_on:
      neo4j:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements-docker.txt
    container_name: safemeds-agent-backend
    env_file:
      - ./.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: safemeds-password
      NEO4J_DATABASE: neo4j
      EMBEDDING_BACKEND: local_hash
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      neo4j-import:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: safemeds-agent-frontend
    env_file:
      - ./.env
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j-data:
  neo4j-logs:
